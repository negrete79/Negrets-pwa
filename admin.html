<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEGRET'S — Painel Admin</title>
<meta name="description" content="Painel administrativo do NEGRET'S — gestão de licenças, clientes, PIX e preços dos planos.">
<meta name="theme-color" content="#080808">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NEGRET'S Admin">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
.hidden{display:none!important}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080808; --bg2:#101012; --card:#17171a; --card2:#1e1e22; --line:#28282e;
  --txt:#f3f3f4; --mut:#9a9aa3; --gold:#C9A227; --gold2:#e3c25a; --green:#0F766E; --green2:#14b8a6;
  --red:#e5484d; --amber:#f59e0b; --r:14px; --sh:0 8px 28px rgba(0,0,0,.4);
}
[data-theme="light"]{
  --bg:#f1f1f4; --bg2:#ffffff; --card:#ffffff; --card2:#f6f6f8; --line:#e2e2e8;
  --txt:#151518; --mut:#6c6c76; --sh:0 8px 24px rgba(20,20,30,.10);
}
html{font-size:15px}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;line-height:1.45;min-height:100vh}
img{max-width:100%;display:block}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#3a3a42;border-radius:9px}
/* ---------- Login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:
  radial-gradient(1000px 500px at 50% -10%,rgba(201,162,39,.10),transparent 60%),var(--bg)}
.lcard{width:min(92vw,400px);background:#ffffff;color:#17171a;border-radius:20px;padding:26px 24px 20px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lcard .logo-n{width:52px;height:52px;font-size:26px;border-radius:14px;margin:0 auto 14px;background:linear-gradient(145deg,#e3c25a,#C9A227)}
.lcard h1{font-size:18px;text-align:center;letter-spacing:.3px;color:#111}
.lcard .sub{text-align:center;font-size:12.5px;color:#7a7a83;margin:4px 0 20px}
.lfield{position:relative;margin-bottom:12px}
.lfield>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#9a9aa3}
.lfield input{width:100%;padding:12px 12px 12px 40px;border:1px solid #e2e2e8;border-radius:12px;font-size:15px;background:#fafafa;color:#17171a;outline:none}
.lfield input:focus{border-color:var(--gold)}
.lfield .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;background:none;color:#9a9aa3;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lfield .eye svg{width:19px;height:19px}
.lcheck{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#43434a;margin:4px 0 16px;cursor:pointer}
.lcheck input{width:17px;height:17px;accent-color:var(--gold)}
.lbtn{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(145deg,#e3c25a,#C9A227);color:#0a0a0a;font-weight:800;font-size:15px;cursor:pointer}
.lbtn:active{transform:scale(.98)}
.llink{display:block;text-align:center;margin-top:14px;font-size:13px;color:#7a7a83;text-decoration:underline;cursor:pointer;background:none;border:none;width:100%}
.lerr{background:rgba(229,72,77,.1);border:1px solid rgba(229,72,77,.4);color:#b3323a;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px;text-align:center}
.lfoot{text-align:center;font-size:11.5px;color:var(--mut);margin-top:26px;letter-spacing:.3px}
.lcard .lfoot{margin-top:18px}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
/* ---------- Painel ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--bg2);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo-n{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0a0a0a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.brand{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:14.5px}
.brand span{font-size:11px;color:var(--mut)}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 13px;border-radius:11px;border:1px solid transparent;font-weight:700;font-size:13px;cursor:pointer;color:#0a0a0a;background:linear-gradient(145deg,var(--gold2),var(--gold));min-height:40px}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn.grn{background:linear-gradient(145deg,#12a594,var(--green));color:#fff}
.btn.ln{background:transparent;border-color:var(--line);color:var(--txt)}
.btn.rd{background:transparent;border-color:rgba(229,72,77,.5);color:var(--red)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:12px;border-radius:9px}
.main{padding:78px 12px 40px;max-width:1200px;margin:0 auto}
.grid-kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.grid-kpi{grid-template-columns:repeat(5,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .l{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:22px;font-weight:800;margin-top:4px}
.kpi .s{font-size:10.5px;color:var(--mut);margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.mt{margin-top:10px}.mb{margin-bottom:10px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11px}
.gold{color:var(--gold2)}
.iwrap{position:relative;width:100%}
.iwrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut);pointer-events:none}
.input,.sel,.ta{width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:15px;font-family:inherit;outline:none;min-height:42px}
.iwrap .input{padding-left:34px}
.input:focus,.sel:focus,.ta:focus{border-color:var(--gold)}
.sel{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.fchip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mut);font-size:12.5px;font-weight:700;cursor:pointer;flex:0 0 auto}
.fchip.act{background:var(--gold);border-color:var(--gold);color:#0a0a0a}
.fchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.3px}
.pill.g{background:rgba(34,197,94,.14);color:#4ade80;border:1px solid rgba(34,197,94,.35)}
.pill.a{background:rgba(245,158,11,.14);color:var(--amber);border:1px solid rgba(245,158,11,.35)}
.pill.r{background:rgba(229,72,77,.14);color:var(--red);border:1px solid rgba(229,72,77,.35)}
.pill.n{background:var(--card2);color:var(--mut);border:1px solid var(--line)}
.pill.vit{background:linear-gradient(145deg,var(--gold2),var(--gold));color:#0a0a0a;border:1px solid var(--gold2)}
/* lista tipo tabela */
.tlist{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:13px}
.trow .c1{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow .fld{display:flex;flex-direction:column;min-width:0}
.trow .fld .k{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.trow .fld .w{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.trow .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
@media(min-width:900px){
  .tlist.tgrid{display:block}
  .tlist.tgrid .thead,.tlist.tgrid .trow{display:grid;grid-template-columns:92px 1.2fr 1.7fr .8fr 1fr minmax(210px,auto);align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);padding:10px 12px}
  .tlist.tgrid .thead{border-radius:12px 12px 0 0;background:var(--card2);border-bottom:none}
  .tlist.tgrid .thead span{font-size:10.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
  .tlist.tgrid .trow{border-radius:0;border-top:none}
  .tlist.tgrid .trow:last-child{border-radius:0 0 12px 12px}
  .tlist.tgrid .trow .fld .k{display:none}
}
.empty{text-align:center;padding:34px 14px;color:var(--mut)}
.empty svg{width:38px;height:38px;margin:0 auto 10px;opacity:.6}
/* modal */
.modal{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.modal .sheet{position:relative;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease}
@media(min-width:640px){.modal .sheet{border-radius:18px;max-height:88vh}}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h3{font-size:16px;flex:1;min-width:0}
.mhead .iconbtn{flex:0 0 34px;width:34px;height:34px}
.iconbtn{width:38px;height:38px;flex:0 0 38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--txt);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn svg{width:19px;height:19px}
.iconbtn:active{transform:scale(.94)}
.mfoot{display:flex;gap:8px;margin-top:14px}
.mfoot .btn{flex:1}
.lbl{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 5px}
.lbl:first-child{margin-top:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chkline{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-top:8px;cursor:pointer}
.chkline input{width:17px;height:17px;accent-color:var(--gold)}
.box{border-radius:12px;padding:12px 14px;font-size:13.5px;border:1px solid}
.box.grn{background:rgba(15,118,110,.16);border-color:rgba(15,118,110,.55);color:#d8f5f1}
.box.grn.center{text-align:center}
.box.grn b{color:#fff}
[data-theme="light"] .box.grn{background:#e7f6f4;color:#0b5c56;border-color:#9adcd6}
[data-theme="light"] .box.grn b{color:#0b3f3b}
.box.gold{background:rgba(201,162,39,.12);border-color:rgba(201,162,39,.5);color:var(--gold2)}
.box.red{background:rgba(229,72,77,.10);border-color:rgba(229,72,77,.45);color:#ffb9bb}
[data-theme="light"] .box.red{color:#a32226}
.box .sub{font-size:12px;opacity:.85;margin-top:3px}
.codbig{font-family:ui-monospace,monospace;font-size:22px;letter-spacing:3px;text-align:center;background:var(--bg);border:1px dashed var(--gold);border-radius:12px;padding:14px;color:var(--gold2)}
#toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;box-shadow:var(--sh);display:flex;gap:8px;align-items:center;animation:up .2s ease}
.toast.ok{border-left-color:#22c55e}
.toast.err{border-left-color:var(--red)}
.toast svg{width:17px;height:17px;flex:0 0 17px;color:var(--mut)}
</style>
</head>

<!-- LOGIN -->
<div class="login" id="vLogin">
  <div>
    <div class="lcard">
      <div class="logo-n">N</div>
      <h1>NEGRET'S &bull; Painel Admin</h1>
      <p class="sub">Acesso restrito ao administrador</p>
      <div class="lerr hidden" id="lErr">E-mail ou senha incorretos</div>
      <form id="lForm" autocomplete="on">
        <div class="lfield">
          <svg><use href="#i-mail"/></svg>
          <input type="email" inputmode="email" id="lEmail" placeholder="E-mail" autocomplete="username" value="admin@negrets.com">
        </div>
        <div class="lfield">
          <svg><use href="#i-lock"/></svg>
          <input type="password" id="lPass" placeholder="Senha" autocomplete="current-password">
          <button type="button" class="eye" id="lEye" aria-label="Mostrar senha"><svg id="lEyeIc"><use href="#i-eye"/></svg></button>
        </div>
        <label class="lcheck"><input type="checkbox" id="lRemember" checked><span>Lembrar de mim</span></label>
        <button class="lbtn" type="submit">Entrar</button>
        <button class="llink" type="button" id="lForgot">Esqueceu a senha?</button>
      </form>
    </div>
    <p class="lfoot">NEGRET'S &bull; Área restrita &bull; Criado por Elias Costa NEGRET'S</p>
  </div>
</div>

<!-- PAINEL -->
<div class="hidden" id="vPanel">
  <header class="top">
    <div class="logo-n">N</div>
    <div class="brand"><b id="adOla">Olá, Elias</b><span id="adMail">admin@negrets.com</span></div>
    <button class="iconbtn" id="adEdit" title="Editar nome"><svg><use href="#i-pencil"/></svg></button>
    <div class="hbtns">
      <button class="btn sm ln" id="adTema"><svg><use href="#i-moon"/></svg>Tema</button>

</body>
<script>
/* ============ NEGRET'S — PAINEL ADMIN (núcleo) ============ */
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const ic=(n)=>'<svg style="width:16px;height:16px"><use href="#i-'+n+'"/></svg>';
const fmt=v=>'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=(v,d=2)=>Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const parseDec=s=>{if(typeof s==='number')return s;let v=String(s||'').trim();if(!v)return 0;if(v.includes(',')&&v.includes('.'))v=v.replace(/\./g,'').replace(',','.');else if(v.includes(','))v=v.replace(',','.');else if((v.match(/\./g)||[]).length>1)v=v.replace(/\./g,'');const n=parseFloat(v);return isNaN(n)?0:n;};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function hojeISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseISO(s){const p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function addDiasISO(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtData(iso){if(!iso)return '—';const p=String(iso).split('-');return p[2]+'/'+p[1]+'/'+p[0];}
function fmtDataCurta(iso){if(!iso)return '—';const p=String(iso).split('-');return p[2]+'/'+p[1];}
function diasEntre(a,b){return Math.round((parseISO(b)-parseISO(a))/86400000);}
function onlyDigits(s){return String(s||'').replace(/\D/g,'');}
const K={db:'negrets_db',pix:'negrets_pix',precos:'negrets_precos',trial:'negrets_trial_inicio',lic:'negrets_licenca'};
const KADM={session:'negrets_admin_session',prefs:'negrets_admin_prefs',email:'negrets_admin_email'};
const DB={
  get(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('Armazenamento cheio.','err');}},
  del(k){localStorage.removeItem(k);},
  push(k,item){const a=DB.get(k,[]);a.push(item);DB.set(k,a);return item;},
  up(k,id,patch){const a=DB.get(k,[]).map(x=>x.id===id?Object.assign({},x,patch):x);DB.set(k,a);}
};
const ADMIN={email:'admin@negrets.com',senha:'negrets123'};
function precos(){return Object.assign({mensal:19.90,sem6:99.90,ano:179.90,mes_gratis:0,vitalicio:997.00,mp_token:'',chave_pix_demo:'',whats_suporte:''},DB.get(K.precos,{}));}
function prefs(){return Object.assign({nome:'Elias',tema:'dark'},DB.get(KADM.prefs,{}));}
function setPrefs(p){DB.set(KADM.prefs,p);}

/* ---------- Toasts / modais ---------- */
function toast(msg,tipo='ok',ms=2800){
  const t=document.createElement('div');t.className='toast '+tipo;
  t.innerHTML=(tipo==='ok'?ic('check'):tipo==='err'?ic('alert'):ic('info'))+'<span>'+esc(msg)+'</span>';
  $('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),320);},ms);
}
function openModal(id){$('#'+id).classList.remove('hidden');}
function closeModal(id){$('#'+id).classList.add('hidden');}
let cfCb=null;
function openConfirm(msg,cb,opts={}){
  $('#cfTitle').textContent=opts.title||'Confirmar';
  $('#cfMsg').textContent=msg;
  const y=$('#cfYes');y.textContent=opts.yes||'Excluir';y.className='btn '+(opts.danger===false?'grn':'rd');
  cfCb=cb;openModal('m-confirm');
}
function openSheet(html){
  $('#gSheet').innerHTML=html;
  $('#gSheet').querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>closeModal('m-generic')));
  openModal('m-generic');
}
const fTxt=(n,l,v='',ph='',attrs='')=>'<label class="lbl">'+l+'</label><input class="input" name="'+n+'" value="'+esc(v)+'" placeholder="'+esc(ph)+'" '+attrs+'>';
/* ---------- Login ---------- */
let sessao=DB.get(KADM.session,null);
function bindLogin(){
  $('#lEye').addEventListener('click',()=>{
    const i=$('#lPass'),ic2=$('#lEyeIc');
    const mostrar=i.type==='password';
    i.type=mostrar?'text':'password';
    ic2.innerHTML='<use href="#i-'+(mostrar?'eyeoff':'eye')+'"/>';
    i.focus();
  });
  $('#lForm').addEventListener('submit',e=>{
    e.preventDefault();
    const em=$('#lEmail').value.trim().toLowerCase(),pw=$('#lPass').value;
    if(em===ADMIN.email&&pw===ADMIN.senha){
      if($('#lRemember').checked)localStorage.setItem(KADM.email,em);else localStorage.removeItem(KADM.email);
      sessao={email:em,ts:Date.now()};DB.set(KADM.session,sessao);
      toast('Bem-vindo de volta!','ok');entrar();
    }else{
      $('#lErr').classList.remove('hidden');
      const card=$('#lForm');card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
    }
  });
  $('#lForgot').addEventListener('click',()=>{
    openSheet('<div class="mhead">'+ic('lock')+'<h3>Recuperar acesso</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
      '<p class="sm mut">O acesso do administrador é local e seguro. Para recuperar sua senha:</p>'+
      '<div class="steps" style="margin-top:10px">'+
      '<p class="sm">1. Entre em contato com o suporte: <b>suporte@negrets.com</b></p>'+
      '<p class="sm">2. Ou apague os dados do painel no aparelho e redefina o acesso.</p></div>'+
      '<div class="mfoot"><a class="btn grn" style="text-decoration:none" href="mailto:suporte@negrets.com">'+ic('mail')+'Enviar e-mail</a></div>');
  });
}
function entrar(){
  $('#vLogin').classList.add('hidden');
  $('#vPanel').classList.remove('hidden');
  const p=prefs();
  $('#adOla').textContent='Olá, '+(p.nome||'Elias');
  $('#adMail').textContent=ADMIN.email;
  renderAll();
}
function sair(){
  DB.del(KADM.session);sessao=null;
  $('#vPanel').classList.add('hidden');
  $('#vLogin').classList.remove('hidden');
  $('#lPass').value='';$('#lErr').classList.add('hidden');
}

/* ---------- Métricas ---------- */
function statusOf(r){
  if(r.deletado)return 'lixeira';
  if(r.plano==='vitalicio'||r.status==='vitalicio')return 'vitalicio';
  if(r.status==='pendente')return 'pendente';
  if(r.validade&&r.validade>=hojeISO())return 'ativo';
  return 'expirado';
}
function metricas(){
  const lista=DB.get(K.db,[]),pix=DB.get(K.pix,[]);
  const hoje=hojeISO();
  const ativos=lista.filter(r=>!r.deletado&&(statusOf(r)==='ativo'||statusOf(r)==='vitalicio')).length;
  const d30=addDiasISO(hoje,-30);
  const faturado=lista.filter(r=>!r.deletado&&(statusOf(r)==='ativo'||statusOf(r)==='vitalicio')&&r.data>=d30).reduce((s,r)=>s+(r.valor||0),0);
  const pagas=lista.filter(r=>!r.deletado&&(r.origem==='pix'||r.origem==='codigo')).length;
  const pendentes=lista.filter(r=>!r.deletado&&statusOf(r)==='pendente').length+pix.filter(p=>p.status==='pendente').length;
  const exp30=lista.filter(r=>!r.deletado&&statusOf(r)==='expirado'&&r.validade&&r.validade<addDiasISO(hoje,-30)).length;
  return {ativos,faturado,pagas,pendentes,exp30};
}
function renderKpis(){
  const m=metricas();
  $('#adKpis').innerHTML=
    '<div class="kpi"><div class="l">'+ic('shield')+'Ativos agora</div><div class="v">'+m.ativos+'</div><div class="s">licenças válidas</div></div>'+
    '<div class="kpi"><div class="l">'+ic('wallet')+'Faturado 30 dias</div><div class="v">'+fmt(m.faturado)+'</div><div class="s">licenças vendidas</div></div>'+
    '<div class="kpi"><div class="l">'+ic('check')+'Ativações pagas</div><div class="v">'+m.pagas+'</div><div class="s">PIX + código</div></div>'+
    '<div class="kpi" id="kpiPend" style="cursor:pointer"><div class="l">'+ic('clock')+'Pendentes</div><div class="v" style="color:var(--amber)">'+m.pendentes+'</div><div class="s">toque para ver PIX</div></div>'+
    '<div class="kpi"><div class="l">'+ic('alert')+'Expirados &gt;30 dias</div><div class="v" style="color:var(--red)">'+m.exp30+'</div><div class="s">reconquista</div></div>';
  $('#kpiPend').addEventListener('click',verPendentes);
}
function verPendentes(){
  const pix=DB.get(K.pix,[]).filter(p=>p.status==='pendente');
  if(!pix.length){toast('Nenhum PIX pendente — tudo em dia!','info');return;}
  openSheet('<div class="mhead">'+ic('cash')+'<h3>Pagamentos PIX pendentes</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
    '<div class="tlist">'+pix.map(p=>'<div class="trow"><div class="c1"><b>'+esc(p.id)+'</b><span class="pill a">PENDENTE</span><span class="xs mut">'+fmtData(p.data)+'</span></div>'+
    '<div class="fld"><span class="k">Plano</span><span class="w">'+esc(p.plano)+'</span></div>'+
    '<div class="fld"><span class="k">Cliente</span><span class="w">'+esc(p.email||'—')+'</span></div>'+
    '<div class="fld"><span class="k">Valor</span><span class="w gold">'+fmt(p.valor)+'</span></div>'+
    '<div class="acts"><button class="btn sm grn" data-ap="'+p.id+'">'+ic('check')+'Aprovar</button>'+
    '<button class="btn sm rd" data-ca="'+p.id+'">Cancelar</button></div></div>').join('')+'</div>'+
    '<p class="xs mut mt">No modo real com token do Mercado Pago a aprovação é automática. Aqui você confirma manualmente o comprovante.</p>');
  $$('#gSheet [data-ap]').forEach(b=>b.addEventListener('click',()=>{
    DB.up(K.pix,b.getAttribute('data-ap'),{status:'aprovado'});
    closeModal('m-generic');toast('PIX aprovado — o app do cliente ativa automaticamente em até 15 segundos.','ok',4200);renderAll();
  }));
  $$('#gSheet [data-ca]').forEach(b=>b.addEventListener('click',()=>{
    DB.up(K.pix,b.getAttribute('data-ca'),{status:'cancelado'});
    closeModal('m-generic');renderAll();
  }));
}

/* ---------- Lista de clientes ---------- */
let adFiltro='todos',adQ='';
function renderList(){
  const el=$('#adList');if(!el)return;
  let lista=DB.get(K.db,[]);
  if(adFiltro!=='todos')lista=lista.filter(r=>statusOf(r)===adFiltro);
  const q=adQ.toLowerCase();
  if(q)lista=lista.filter(r=>(r.email||'').toLowerCase().includes(q)||(r.nome||'').toLowerCase().includes(q)||(r.id||'').toLowerCase().includes(q)||(r.codigo||'').toLowerCase().includes(q));
  lista.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  if(!lista.length){el.innerHTML='<div class="empty">'+ic('users')+'<b>Nenhum cliente aqui</b>As ativações do app aparecem nesta lista automaticamente.</div>';return;}
  const badge=r=>{
    const st=statusOf(r);
    if(st==='vitalicio')return '<span class="pill vit">👑 PRO MAX • VITALÍCIO</span>';
    if(st==='ativo')return '<span class="pill g">ATIVO</span>';
    if(st==='pendente')return '<span class="pill a">PENDENTE</span>';
    if(st==='expirado')return '<span class="pill r">EXPIRADO</span>';
    return '<span class="pill n">LIXEIRA</span>';
  };
  el.innerHTML='<div class="thead"><span>Data</span><span>Nome</span><span>E-mail</span><span>Valor</span><span>Status</span><span>Ações</span></div>'+
    lista.map(r=>{
      const st=statusOf(r);
      const acoes=st==='lixeira'
        ?'<button class="btn sm grn" data-restore="'+r.id+'">'+ic('refresh')+'Restaurar</button><button class="btn sm rd" data-purge="'+r.id+'">'+ic('trash')+'Apagar</button>'
        :'<button class="btn sm ln" data-code="'+r.id+'" title="Código de ativação">'+ic('key')+(r.codigo?'Copiar':'Código')+'</button>'+
         '<button class="btn sm ln" data-edit="'+r.id+'">'+ic('pencil')+'Editar</button>'+
         '<button class="btn sm rd" data-del="'+r.id+'">'+ic('trash')+'Excluir</button>';
      return '<div class="trow">'+
        '<div class="fld"><span class="k">Data</span><span class="w">'+fmtData(r.data)+'</span></div>'+
        '<div class="fld"><span class="k">Nome</span><span class="w">'+esc(r.nome||'—')+'</span></div>'+
        '<div class="fld"><span class="k">E-mail</span><span class="w">'+esc(r.email||'—')+'</span></div>'+
        '<div class="fld"><span class="k">Valor</span><span class="w gold">'+fmt(r.valor)+'</span></div>'+
        '<div class="fld"><span class="k">Status</span><span class="w">'+badge(r)+'<br><span class="xs mut">'+(r.validade?'até '+fmtData(r.validade):(r.plano?'plano '+esc(r.plano):''))+'</span></span></div>'+
        '<div class="acts">'+acoes+'</div></div>';
    }).join('');
  el.querySelectorAll('[data-code]').forEach(b=>b.addEventListener('click',()=>verCodigo(b.getAttribute('data-code'))));
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editarCliente(b.getAttribute('data-edit'))));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>excluirCliente(b.getAttribute('data-del'))));
  el.querySelectorAll('[data-restore]').forEach(b=>b.addEventListener('click',()=>{
    DB.up(K.db,b.getAttribute('data-restore'),{deletado:false});
    toast('Cliente restaurado!','ok');renderAll();
  }));
  el.querySelectorAll('[data-purge]').forEach(b=>b.addEventListener('click',()=>{
    openConfirm('Apagar este cliente para sempre?',()=>{
      DB.set(K.db,DB.get(K.db,[]).filter(x=>x.id!==b.getAttribute('data-purge')));
      toast('Apagado definitivamente.','ok');renderAll();
    },{title:'Apagar definitivo'});
  }));
}
function renderAll(){renderKpis();renderList();}
</script>
<script>
/* ============ NEGRET'S — PAINEL ADMIN (ações) ============ */
function verCodigo(id){
  const r=DB.get(K.db,[]).find(x=>x.id===id);if(!r)return;
  if(!r.codigo){
    const p=precos();
    const planos={mensal:{d:30,v:p.mensal},sem6:{d:180,v:p.sem6},ano:{d:365,v:p.ano},mes_gratis:{d:30,v:0},vitalicio:{d:3650,v:p.vitalicio}};
    openSheet('<div class="mhead">'+ic('tag')+'<h3>Gerar código de ativação</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
      '<p class="sm mut mb">Escolha o plano do cliente <b>'+esc(r.nome||r.email||'')+'</b>. O código NEG-XXXX-XXXX é único e vai direto para ele ativar no app.</p>'+
      '<div class="plans" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
      Object.keys(planos).map(k=>'<button class="btn ln" data-pl="'+k+'">'+(k==='vitalicio'?'👑 PRO MAX • VITALÍCIO':({mensal:'Mensal',sem6:'6 Meses',ano:'1 Ano',mes_gratis:'Mês Grátis'}[k]))+'<br><span class="xs">'+fmt(planos[k].v)+' — '+planos[k].d+' dias</span></button>').join('')+'</div>');
    $$('#gSheet [data-pl]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.getAttribute('data-pl');
      const cod=gerarCodigo();
      DB.up(K.db,id,{codigo:cod,plano:k,dias:planos[k].d,valor:r.valor||planos[k].v,status:r.status&&r.status!=='ativo'?r.status:'pendente'});
      verCodigoModal(cod,id);
    }));
    return;
  }
  verCodigoModal(r.codigo,id);
}
function gerarCodigo(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let cod;
  do{
    const a=Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
    const b=Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
    cod='NEG-'+a+'-'+b;
  }while(DB.get(K.db,[]).some(r=>r.codigo===cod));
  return cod;
}
function verCodigoModal(cod,id){
  openSheet('<div class="mhead">'+ic('key')+'<h3>Código de ativação</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
    '<div class="codbig">'+esc(cod)+'</div>'+
    '<p class="xs mut mt">Envie ao cliente. Ele digita no app em <b>ATIVAR COM CÓDIGO</b> e a licença entra na hora.</p>'+
    '<div class="mfoot"><button class="btn grn" id="cpCod">'+ic('copy')+'Copiar código</button></div>');
  $('#cpCod').addEventListener('click',()=>{
    try{navigator.clipboard.writeText(cod);}catch(e){}
    toast('Código copiado!','ok');
  });
}
function editarCliente(id){
  const r=DB.get(K.db,[]).find(x=>x.id===id);if(!r)return;
  const p=precos();
  const planos=[['','— sem plano —'],['mensal','Mensal (30 dias)'],['sem6','6 Meses (180 dias)'],['ano','1 Ano (365 dias)'],['mes_gratis','Mês Grátis (30 dias)'],['vitalicio','👑 PRO MAX • VITALÍCIO (3650 dias)']];
  openSheet('<div class="mhead">'+ic('pencil')+'<h3>Editar cliente</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
    '<form id="cliForm">'+
    fTxt('nome','Nome',r.nome||'')+
    '<label class="lbl">E-mail</label><input class="input" name="email" type="email" inputmode="email" value="'+esc(r.email||'')+'">'+
    '<label class="lbl">Plano</label><select class="sel" name="plano">'+planos.map(([v,t])=>'<option value="'+v+'"'+((r.plano||'')===v?' selected':'')+'>'+t+'</option>').join('')+'</select>'+
    fTxt('valor','Valor pago (R$)',fmtN(r.valor||0),'0,00','inputmode="decimal" data-dec')+
    fTxt('obs','Observações',r.obs||'','anotações internas')+
    '<div class="mfoot"><button type="submit" class="btn grn">'+ic('check')+'Salvar</button></div></form>');
  const dec=$('#gSheet [data-dec]');dec&&(dec.value=String(r.valor||0).replace('.',','));
  $('#cliForm').addEventListener('submit',e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const plano=fd.get('plano');
    const dias={mensal:30,sem6:180,ano:365,mes_gratis:30,vitalicio:3650}[plano]||r.dias||30;
    DB.up(K.db,id,{nome:fd.get('nome').trim(),email:fd.get('email').trim(),plano,dias,valor:parseDec(fd.get('valor')),obs:fd.get('obs')});
    if(plano&&r.validade&&r.validade<hojeISO())DB.up(K.db,id,{validade:''});
    closeModal('m-generic');toast('Cliente atualizado!','ok');renderAll();
  });
}
function excluirCliente(id){

function csvExport(){
  const lista=DB.get(K.db,[]).filter(r=>!r.deletado);
  if(!lista.length){toast('Sem clientes para exportar.','info');return;}
  const linhas=['Data;Nome;E-mail;Valor;Status;Plano;Validade;Código'];
  lista.forEach(r=>{
    const st=statusOf(r)==='vitalicio'?'PRO MAX • VITALÍCIO':statusOf(r).toUpperCase();
    linhas.push([fmtData(r.data),r.nome||'',r.email||'',fmtN(r.valor),st,r.plano||'',r.validade?fmtData(r.validade):'',r.codigo||''].join(';'));
  });
  const blob=new Blob(['\ufeff'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='negrets_clientes_'+hojeISO()+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('CSV exportado!','ok');
}

/* ---------- Tema / instalar / tempo real ---------- */
function applyTema(){document.documentElement.setAttribute('data-theme',prefs().tema||'dark');}
let installEvt=null;
function bindPanel(){
  applyTema();
  const lem=localStorage.getItem(KADM.email);
  if(lem)$('#lEmail').value=lem;
  $('#adOut').addEventListener('click',sair);
  $('#adEdit').addEventListener('click',()=>openSheet('<div class="mhead">'+ic('pencil')+'<h3>Seu nome</h3><button class="iconbtn" data-x><svg><use href="#i-x"/></svg></button></div>'+
    '<form id="nmForm">'+fTxt('nome','Como quer ser chamado?',prefs().nome||'Elias')+
    '<div class="mfoot"><button type="submit" class="btn grn">'+ic('check')+'Salvar</button></div></form>'));
  document.addEventListener('submit',e=>{
    if(e.target&&e.target.id==='nmForm'){
      e.preventDefault();
      const fd=new FormData(e.target);
      const np=prefs();np.nome=fd.get('nome').trim()||'Elias';setPrefs(np);
      $('#adOla').textContent='Olá, '+np.nome;
      closeModal('m-generic');toast('Nome atualizado!','ok');
    }
  });
  $('#adTema').addEventListener('click',()=>{
    const np=prefs();np.tema=np.tema==='dark'?'light':'dark';setPrefs(np);
    applyTema();
    const ic2=$('#adTema svg use');ic2&&ic2.setAttribute('href','#i-'+(np.tema==='dark'?'moon':'sun'));
    toast('Tema '+(np.tema==='dark'?'escuro':'claro')+' ativado.','ok',1500);
  });
  $('#adWa').addEventListener('click',waSuporte);
  $('#adCfg').addEventListener('click',cfgModal);
  $('#adLic').addEventListener('click',licAdmin);
  $('#adRefresh').addEventListener('click',()=>{renderAll();toast('Dados atualizados.','ok',1500);});
  $('#adCsv').addEventListener('click',csvExport);
  $('#adNovo').addEventListener('click',novoCliente);
  $('#adPrecos').addEventListener('click',precosModal);
  $('#adVazio').addEventListener('click',()=>{
    const lixo=DB.get(K.db,[]).filter(r=>r.deletado);
    if(!lixo.length){toast('A lixeira está vazia.','info');return;}
    openConfirm('Apagar DEFINITIVAMENTE '+lixo.length+' cliente(s) da lixeira?',()=>{
      DB.set(K.db,DB.get(K.db,[]).filter(r=>!r.deletado));
      toast('Lixeira esvaziada.','ok');renderAll();
    },{title:'Esvaziar lixeira',yes:'Esvaziar'});
  });
  $('#adQ').addEventListener('input',e=>{adQ=e.target.value;renderList();});
  $$('.fchip').forEach(b=>b.addEventListener('click',()=>{
    adFiltro=b.getAttribute('data-f');
    $$('.fchip').forEach(x=>x.classList.toggle('act',x===b));
    renderList();
  }));
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;$('#adInst').classList.remove('hidden');});
  $('#adInst').addEventListener('click',()=>{if(installEvt){installEvt.prompt();installEvt.userChoice.then(()=>{installEvt=null;});}});
  window.addEventListener('appinstalled',()=>{$('#adInst').classList.add('hidden');toast('App instalado!','ok');});
  window.addEventListener('storage',e=>{
    if([K.db,K.pix,K.precos,K.lic,K.trial].includes(e.key))renderAll();
  });
}

/* ---------- Boot ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  bindLogin();
  if(sessao){entrar();}
  else{
    const lem=localStorage.getItem(KADM.email);
    if(lem)$('#lEmail').value=lem;

  }
});
